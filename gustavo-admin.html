<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gustavo Private Workspace | Casa de SAM</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="gustavo-admin">
    <header>
      <p class="sam-kicker">Casa de SAM · Private planning</p>
      <h1>Gustavo Workspace</h1>
      <p>Prepare role briefs, onboarding materials, question lists, and Paraguay/U.S. nonprofit decision packets. Unknowns stay visibly unresolved.</p>
    </header>

    <section class="sam-card gustavo-admin-login">
      <label for="gustavo-access">Private access code</label>
      <div class="gustavo-admin-access">
        <input id="gustavo-access" type="password" autocomplete="current-password">
        <button id="gustavo-unlock" type="button">Open workspace</button>
      </div>
      <p class="gustavo-admin-status" aria-live="polite"></p>
    </section>

    <section class="gustavo-admin-workspace" hidden>
      <div class="gustavo-admin-prompts" aria-label="Planning starters">
        <button type="button">Draft a concise Gustavo role brief and mark every unresolved decision.</button>
        <button type="button">List the exact questions and documents we need from Gustavo for nonprofit formation.</button>
        <button type="button">Build the current Paraguay/U.S. nonprofit decision packet with dependencies and follow-up fields.</button>
      </div>
      <div class="gustavo-admin-messages" role="log" aria-live="polite"></div>
      <form class="gustavo-admin-form">
        <label for="gustavo-admin-message">What should Gustavo prepare?</label>
        <textarea id="gustavo-admin-message" rows="5" maxlength="2400" required></textarea>
        <button type="submit">Prepare it</button>
      </form>
    </section>
  </main>
  <script src="js/gustavo-admin.js"></script>
</body>
</html>
